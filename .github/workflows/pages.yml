# Publishes the download page in site/ to GitHub Pages whenever it changes on main.
name: Download page

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # site/index.html is written without a document skeleton (it is also published as a
      # Claude artifact, which adds one), so add the doctype, charset and viewport here.
      - name: Build page
        run: |
          mkdir _site
          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '<meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<link rel="icon" type="image/png" href="icon.png">'
            echo '<link rel="apple-touch-icon" href="icon.png">'
            cat site/index.html
          } > _site/index.html
          cp site/icon.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
